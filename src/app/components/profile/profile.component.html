<div class="row">
    <div class="col-lg-7">
        <div class="card p-3 p-md-4">
            <h5 class="mb-3"><i class="bi bi-person-circle me-2 text-brand"></i>My profile</h5>

            <!-- @if (success()) {
            <div class="alert alert-success py-2">{{ success() }}</div>
            }
            @if (error()) {
            <div class="alert alert-danger py-2">{{ error() }}</div>
            } -->

            <form > <!-- (ngSubmit)="save()" #f="ngForm"-->
                <div class="mb-3">
                    <label class="form-label">Full name</label>
                    <input type="text" class="form-control" name="fullName"  required /> <!-- [(ngModel)]="fullName"-->
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"  disabled /> <!-- [value]="member()?.email"-->
                </div>
                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" name="phone" /> <!-- [(ngModel)]="phone"-->
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label class="form-label">ID number</label>
                        <input type="text" class="form-control" name="idNumber" /> <!-- [(ngModel)]="idNumber"-->
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Monthly contribution (R)</label>
                    <input type="number" min="0" class="form-control" name="monthlyContribution"
                         /> <!-- [(ngModel)]="monthlyContribution"-->
                </div>
                <!-- <button type="submit" class="btn btn-primary" [disabled]="loading() || f.invalid">
                    @if (loading()) {
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    Save changes
                </button> -->
            </form>
        </div>
    </div>
</div>
